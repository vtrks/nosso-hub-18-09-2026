<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho - Acesso 💚</title>
    <style>
        :root {
            --bg-color: #F4F1EA;
            --card-bg: #4A5D4E;
            --text-main: #2C3531;
            --text-light: #F4F1EA;
            --accent-gold: #C5A880;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .lock-card {
            background-color: var(--card-bg);
            color: var(--text-light);
            padding: 28px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(44, 53, 49, 0.2);
            width: 100%;
            max-width: 320px;
            text-align: center;
            border: 1px solid var(--accent-gold);
            box-sizing: border-box;
        }

        .lock-card h2 {
            font-size: 1.3rem;
            margin-top: 0;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .lock-card p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .lock-card input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--accent-gold);
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-main);
            font-size: 1.1rem;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 14px;
            outline: none;
        }

        .lock-card button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-gold);
            color: var(--text-main);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .lock-card button:active {
            opacity: 0.8;
        }

        .error-msg {
            color: #ffb4b4;
            font-size: 0.8rem;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="lock-card">
        <h2>Área Secreta 💚</h2>
        <p>Digite a senha do nosso cantinho:</p>
        <form onsubmit="checkPassword(event)">
            <input type="password" id="password-input" placeholder="Senha" autofocus required autocomplete="off">
            <button type="submit">Entrar</button>
            <div id="error-msg" class="error-msg">Senha incorreta, mozão! Tenta de novo.</div>
        </form>
    </div>

    <script>
        const correctPassword = "1809";

        function checkPassword(event) {
            event.preventDefault();
            const input = document.getElementById("password-input").value.trim();
            const errorMsg = document.getElementById("error-msg");

            if (input === correctPassword) {
                // Redireciona para o Hub principal
                window.location.href = "hub.html";
            } else {
                errorMsg.style.display = "block";
                document.getElementById("password-input").value = "";
            }
        }
    </script>
</body>
</html>
