<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Termo do Amor 🔠</title>
    <style>
        :root {
            --bg-color: #F4F1EA;
            --card-bg: #4A5D4E;
            --text-main: #2C3531;
            --text-light: #F4F1EA;
            --accent-gold: #C5A880;
            --correct-green: #6aaa64;
            --present-yellow: #c9b458;
            --absent-gray: #787c7e;
        }

        html, body {
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 10px 14px;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }

        .header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .back-btn {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }

        h1 {
            font-size: 1.15rem;
            color: var(--card-bg);
            margin: 0;
        }

        /* Grade do Jogo expandida para ocupar a tela */
        .board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            margin: 8px 0;
            flex-grow: 1;
            justify-content: center;
            align-content: center;
            width: 100%;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            justify-content: center;
        }

        .tile {
            width: 48px;
            height: 48px;
            border: 2px solid #d3d6da;
            background-color: white;
            font-size: 1.4rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .tile.filled {
            border-color: var(--card-bg);
        }

        .tile.correct {
            background-color: var(--correct-green);
            color: white;
            border-color: var(--correct-green);
        }

        .tile.present {
            background-color: var(--present-yellow);
            color: white;
            border-color: var(--present-yellow);
        }

        .tile.absent {
            background-color: var(--absent-gray);
            color: white;
            border-color: var(--absent-gray);
        }

        /* Seção inferior expandida para preencher o espaço */
        .bottom-section {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            margin-bottom: 6px;
        }

        /* Teclado Virtual Maior e Mais Visível */
        .keyboard {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .key {
            background-color: #d3d6da;
            border: none;
            padding: 12px 0;
            flex: 1;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .key.wide {
            flex: 1.5;
            font-size: 0.7rem;
        }

        .key.correct { background-color: var(--correct-green); color: white; }
        .key.present { background-color: var(--present-yellow); color: white; }
        .key.absent { background-color: var(--absent-gray); color: white; }

        /* Barra de Música no Rodapé */
        .music-player-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            box-sizing: border-box;
        }

        .music-player-bar button {
            background: var(--accent-gold);
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--text-main);
            font-weight: bold;
        }

        .music-player-bar span {
            font-size: 0.72rem;
            color: var(--text-light);
            font-weight: 500;
        }

        /* Modal de Finalizado / Vitória / Derrota */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: var(--card-bg);
            color: var(--text-light);
            padding: 24px;
            border-radius: 18px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--accent-gold);
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            color: var(--accent-gold);
            margin-top: 0;
            font-size: 1.25rem;
        }

        .modal-content p {
            font-size: 0.85rem;
            line-height: 1.4;
            opacity: 0.95;
            margin: 8px 0;
        }

        .countdown-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 10px;
            margin: 12px 0;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .modal-content a, .modal-content button {
            background-color: var(--accent-gold);
            color: var(--text-main);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Proteção de Acesso -->
    <script>
        if (localStorage.getItem('isAuthenticated') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <!-- Elemento de Áudio Global -->
    <audio id="bg-audio" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div class="header">
        <a href="hub.html" class="back-btn">← Menu</a>
        <h1>Termo do Amor 🔠</h1>
        <div style="width: 50px;"></div>
    </div>

    <!-- Grade (6 x 5) -->
    <div class="board" id="board"></div>

    <!-- Seção Inferior: Teclado + Player de Música -->
    <div class="bottom-section">
        <!-- Teclado Virtual -->
        <div class="keyboard" id="keyboard">
            <div class="keyboard-row">
                <button class="key" data-key="Q">Q</button>
                <button class="key" data-key="W">W</button>
                <button class="key" data-key="E">E</button>
                <button class="key" data-key="R">R</button>
                <button class="key" data-key="T">T</button>
                <button class="key" data-key="Y">Y</button>
                <button class="key" data-key="U">U</button>
                <button class="key" data-key="I">I</button>
                <button class="key" data-key="O">O</button>
                <button class="key" data-key="P">P</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="A">A</button>
                <button class="key" data-key="S">S</button>
                <button class="key" data-key="D">D</button>
                <button class="key" data-key="F">F</button>
                <button class="key" data-key="G">G</button>
                <button class="key" data-key="H">H</button>
                <button class="key" data-key="J">J</button>
                <button class="key" data-key="K">K</button>
                <button class="key" data-key="L">L</button>
            </div>
            <div class="keyboard-row">
                <button class="key wide" data-key="ENTER">Entrar</button>
                <button class="key" data-key="Z">Z</button>
                <button class="key" data-key="X">X</button>
                <button class="key" data-key="C">C</button>
                <button class="key" data-key="V">V</button>
                <button class="key" data-key="B">B</button>
                <button class="key" data-key="N">N</button>
                <button class="key" data-key="M">M</button>
                <button class="key wide" data-key="BACK">⌫</button>
            </div>
        </div>

        <!-- Barra de Música no Rodapé -->
        <div class="music-player-bar">
            <button id="play-btn" onclick="togglePlay()">▶</button>
            <span>Nossa Música 🎵</span>
            <div style="width: 26px;"></div>
        </div>
    </div>

    <!-- Modal de Resultado / Fim do Jogo -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Acertou, Mozão! 💚</h2>
            <p id="modal-word" style="font-weight: bold; font-size: 1.05rem; color: var(--accent-gold);"></p>
            <p id="modal-def"></p>
            <p id="modal-etim" style="font-style: italic; font-size: 0.75rem;"></p>
            <p id="modal-trivia"></p>
            <p style="margin-top: 10px; font-weight: 500; color: var(--accent-gold);">Volte amanhã para descobrir a próxima palavra! ✨</p>
            
            <div class="countdown-box">
                Próxima palavra em: <span id="countdown-timer">00:00:00</span>
            </div>

            <a href="hub.html">Voltar ao Menu Principal 🏠</a>
        </div>
    </div>

    <script>
        let wordsData = [];
        let currentWordObj = {};
        let targetWord = "";
        let currentRow = 0;
        let currentCol = 0;
        let guesses = ['', '', '', '', '', ''];
        let gameOver = false;

        const startDateRef = new Date(2026, 8, 18, 0, 0, 0);

        function getDayIndex() {
            const now = new Date();
            const diffTime = now.setHours(0,0,0,0) - startDateRef.setHours(0,0,0,0);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays >= 0 ? diffDays : 0;
        }

        async function initGame() {
            try {
                const response = await fetch('palavras.json');
                wordsData = await response.json();

                const dayIndex = getDayIndex() % wordsData.length;
                currentWordObj = wordsData[dayIndex];
                targetWord = currentWordObj.palavra.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();

                buildBoard();

                const lastCompletedDay = localStorage.getItem('termoCompletedDay');
                const todayStr = new Date().toDateString();

                if (lastCompletedDay === todayStr) {
                    gameOver = true;
                    showModal(true);
                }
            } catch (error) {
                console.error("Erro ao carregar palavras.json", error);
            }
        }

        function buildBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let r = 0; r < 6; r++) {
                const row = document.createElement('div');
                row.className = 'row';
                for (let c = 0; c < 5; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.id = `tile-${r}-${c}`;
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }
        }

        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('click', () => {
                handleInput(key.getAttribute('data-key'));
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleInput('ENTER');
            else if (e.key === 'Backspace') handleInput('BACK');
            else {
                const letter = e.key.toUpperCase();
                if (/^[A-ZÇ]$/.test(letter)) handleInput(letter);
            }
        });

        function handleInput(key) {
            if (gameOver) return;

            if (key === 'BACK') {
                if (currentCol > 0) {
                    currentCol--;
                    guesses[currentRow] = guesses[currentRow].slice(0, -1);
                    updateTile();
                }
            } else if (key === 'ENTER') {
                if (currentCol === 5) {
                    checkRow();
                }
            } else {
                if (currentCol < 5) {
                    guesses[currentRow] += key;
                    updateTile();
                    currentCol++;
                }
            }
        }

        function updateTile() {
            const currentGuess = guesses[currentRow];
            for (let c = 0; c < 5; c++) {
                const tile = document.getElementById(`tile-${currentRow}-${c}`);
                tile.innerText = currentGuess[c] || '';
                if (currentGuess[c]) {
                    tile.classList.add('filled');
                } else {
                    tile.classList.remove('filled');
                }
            }
        }

        function checkRow() {
            const guess = guesses[currentRow];
            const targetChars = targetWord.split('');
            const guessChars = guess.split('');
            const rowTiles = [];

            for (let c = 0; c < 5; c++) {
                rowTiles.push(document.getElementById(`tile-${currentRow}-${c}`));
            }

            let matchCount = 0;
            for (let c = 0; c < 5; c++) {
                if (guessChars[c] === targetChars[c]) {
                    rowTiles[c].classList.add('correct');
                    updateKeyColor(guessChars[c], 'correct');
                    targetChars[c] = null;
                    guessChars[c] = null;
                    matchCount++;
                }
            }

            for (let c = 0; c < 5; c++) {
                if (guessChars[c] !== null) {
                    const index = targetChars.indexOf(guessChars[c]);
                    if (index > -1) {
                        rowTiles[c].classList.add('present');
                        updateKeyColor(guessChars[c], 'present');
                        targetChars[index] = null;
                    } else {
                        rowTiles[c].classList.add('absent');
                        updateKeyColor(guessChars[c], 'absent');
                    }
                }
            }

            if (matchCount === 5) {
                gameOver = true;
                localStorage.setItem('termoCompletedDay', new Date().toDateString());
                setTimeout(() => showModal(true), 400);
            } else if (currentRow === 5) {
                gameOver = true;
                localStorage.setItem('termoCompletedDay', new Date().toDateString());
                setTimeout(() => showModal(false), 400);
            } else {
                currentRow++;
                currentCol = 0;
            }
        }

        function updateKeyColor(letter, status) {
            document.querySelectorAll('.key').forEach(key => {
                if (key.getAttribute('data-key') === letter) {
                    if (key.classList.contains('correct')) return;
                    if (key.classList.contains('present') && status === 'absent') return;
                    key.className = `key ${status}`;
                    if(key.getAttribute('data-key').length > 1) key.classList.add('wide');
                }
            });
        }

        function showModal(isWin) {
            const titleElem = document.getElementById('modal-title');
            if (isWin) {
                titleElem.innerText = "Acertou, Mozão! 💚";
            } else {
                titleElem.innerText = "Quase lá, meu amor! 💚";
            }

            document.getElementById('modal-word').innerText = `Palavra: ${currentWordObj.palavra}`;
            document.getElementById('modal-def').innerText = `📖 ${currentWordObj.definicao}`;
            document.getElementById('modal-etim').innerText = `Origem: ${currentWordObj.etimologia}`;
            document.getElementById('modal-trivia').innerText = `💚 ${currentWordObj.curiosidade}`;
            
            document.getElementById('result-modal').style.display = 'flex';
            startCountdown();
        }

        function startCountdown() {
            const timerElem = document.getElementById('countdown-timer');

            function updateTimer() {
                const now = new Date();
                const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
                const diff = tomorrow - now;

                if (diff <= 0) {
                    timerElem.innerText = "00:00:00";
                    return;
                }

                const hours = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
                const minutes = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
                const seconds = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

                timerElem.innerText = `${hours}:${minutes}:${seconds}`;
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        initGame();

        // Gerenciamento do Áudio e Persistência
        const audio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('play-btn');

        const savedTime = localStorage.getItem('audioCurrentTime');
        if (savedTime) {
            audio.currentTime = parseFloat(savedTime);
        }

        const shouldPlay = localStorage.getItem('audioPlaying') !== 'false';

        if (shouldPlay) {
            audio.play().then(() => {
                playBtn.innerText = '⏸';
                localStorage.setItem('audioPlaying', 'true');
            }).catch(() => {
                const unlockAudio = () => {
                    audio.play().then(() => {
                        playBtn.innerText = '⏸';
                        localStorage.setItem('audioPlaying', 'true');
                        document.removeEventListener('click', unlockAudio);
                        document.removeEventListener('touchstart', unlockAudio);
                    });
                };
                document.addEventListener('click', unlockAudio);
                document.addEventListener('touchstart', unlockAudio);
            });
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '⏸';
                localStorage.setItem('audioPlaying', 'true');
            } else {
                audio.pause();
                playBtn.innerText = '▶';
                localStorage.setItem('audioPlaying', 'false');
            }
        }

        audio.addEventListener('timeupdate', () => {
            localStorage.setItem('audioCurrentTime', audio.currentTime);
        });

        window.addEventListener('beforeunload', () => {
            localStorage.setItem('audioCurrentTime', audio.currentTime);
            localStorage.setItem('audioPlaying', !audio.paused);
        });
    </script>
</body>
</html>
