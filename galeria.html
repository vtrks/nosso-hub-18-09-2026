<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nossas Memórias 📸</title>
    <style>
        :root {
            --bg-color: #F4F1EA;
            --card-bg: #4A5D4E;
            --text-main: #2C3531;
            --text-light: #F4F1EA;
            --accent-gold: #C5A880;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }

        h1 {
            font-size: 1.1rem;
            color: var(--card-bg);
            margin: 0;
        }

        /* Grade da Galeria para Celular */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            padding-bottom: 80px; /* Espaço para o player fixo embaixo */
        }

        .gallery-item {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: #ddd;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(44, 53, 49, 0.08);
            border: 1px solid rgba(197, 168, 128, 0.4);
            transition: transform 0.2s;
        }

        .gallery-item:active {
            transform: scale(0.96);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Lightbox (Tela Cheia com botões fixos embaixo) */
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(44, 53, 49, 0.95);
            z-index: 999;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 30px 20px;
            box-sizing: border-box;
        }

        .lightbox-top {
            width: 100%;
            display: flex;
            justify-content: flex-end;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 2rem;
            cursor: pointer;
            padding: 0 10px;
        }

        .lightbox-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            max-height: 65vh;
        }

        #lightbox img {
            max-width: 100%;
            max-height: 55vh;
            border-radius: 12px;
            object-fit: contain;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .caption {
            color: var(--text-light);
            margin-top: 12px;
            font-size: 0.85rem;
            text-align: center;
            font-style: italic;
            opacity: 0.9;
        }

        .lightbox-controls {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 320px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .lightbox-btn {
            background-color: var(--accent-gold);
            color: var(--text-main);
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .lightbox-btn:active {
            transform: scale(0.96);
        }

        /* Barra Fixa do Player de Música no Rodapé da Galeria */
        .bottom-player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-color);
            border-top: 1px solid rgba(197, 168, 128, 0.4);
            padding: 10px 16px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            z-index: 100;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
        }

        .music-player-inner {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .music-player-inner button {
            background: var(--accent-gold);
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--text-main);
            font-weight: bold;
        }

        .music-player-inner span {
            font-size: 0.75rem;
            color: var(--text-light);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Elemento de Áudio Global -->
    <audio id="bg-audio" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div class="header">
        <a href="hub.html" class="back-btn">← Menu</a>
        <h1>Nossas Memórias 📸</h1>
        <div style="width: 45px;"></div>
    </div>

    <!-- Grade de Fotos -->
    <div class="gallery-grid" id="gallery-grid">
        <!-- As fotos são carregadas automaticamente aqui -->
    </div>

    <!-- Barra Fixa de Música no Rodapé -->
    <div class="bottom-player-bar">
        <div class="music-player-inner">
            <button id="play-btn" onclick="togglePlay()">▶</button>
            <span>Luan Santana 🎵</span>
            <div style="width: 28px;"></div> <!-- Elemento invisível para centralizar o texto perfeitamente -->
        </div>
    </div>

    <!-- Visualizador de Tela Cheia (Lightbox) -->
    <div id="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-top">
            <button class="close-btn" onclick="closeLightbox()">×</button>
        </div>

        <div class="lightbox-body">
            <img id="lightbox-img" src="" alt="Foto Ampliada">
            <div class="caption" id="lightbox-caption"></div>
        </div>

        <div class="lightbox-controls" onclick="event.stopPropagation()">
            <button class="lightbox-btn" onclick="prevPhoto()">← Anterior</button>
            <button class="lightbox-btn" onclick="nextPhoto()">Próxima →</button>
        </div>
    </div>

    <script>
        // Adicione quantas fotos quiser aqui na lista!
        const photos = [
            { src: "fotos/foto1.jpg", caption: "Comendo de graça num rolê bem esquisito." },
            { src: "fotos/foto2.jpg", caption: "Passeando por aí! 😎" },
            { src: "fotos/foto3.jpg", caption: "Um dia de sol nessa cidade ☀️" },
            { src: "fotos/foto4.jpg", caption: "Encontro romântico 🍝" },
            { src: "fotos/foto5.jpg", caption: "Atolamos o carro kkkkkkk" },
            { src: "fotos/foto6.jpg", caption: "Jantar legal!" },
            { src: "fotos/foto7.jpg", caption: "80's 🪩" }
        ];

        let currentIndex = 0;

        function loadGallery() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            photos.forEach((photo, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(index);

                const img = document.createElement('img');
                img.src = photo.src;
                img.alt = photo.caption;
                img.onerror = function() {
                    this.src = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='150' height='150' viewBox='0 0 24 24' fill='none' stroke='%23C5A880' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Ccircle cx='8.5' cy='8.5' r='1.5'%3E%3C/circle%3E%3Cpolyline points='21 15 16 10 5 21'%3E%3C/polyline%3E%3C/svg%3E";
                };

                item.appendChild(img);
                grid.appendChild(item);
            });
        }

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxContent();
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox(event) {
            if (!event || event.target.id === 'lightbox' || event.target.classList.contains('close-btn')) {
                document.getElementById('lightbox').style.display = 'none';
            }
        }

        function updateLightboxContent() {
            const photo = photos[currentIndex];
            document.getElementById('lightbox-img').src = photo.src;
            document.getElementById('lightbox-caption').innerText = photo.caption;
        }

        function nextPhoto() {
            currentIndex = (currentIndex + 1) % photos.length;
            updateLightboxContent();
        }

        function prevPhoto() {
            currentIndex = (currentIndex - 1 + photos.length) % photos.length;
            updateLightboxContent();
        }

        loadGallery();

        // Gerenciamento do Áudio e Persistência
        const audio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('play-btn');

        const savedTime = localStorage.getItem('audioCurrentTime');
        if (savedTime) {
            audio.currentTime = parseFloat(savedTime);
        }

        const shouldPlay = localStorage.getItem('audioPlaying') !== 'false';

        if (shouldPlay) {
            audio.play().then(() => {
                playBtn.innerText = '⏸';
                localStorage.setItem('audioPlaying', 'true');
            }).catch(() => {
                const unlockAudio = () => {
                    audio.play().then(() => {
                        playBtn.innerText = '⏸';
                        localStorage.setItem('audioPlaying', 'true');
                        document.removeEventListener('click', unlockAudio);
                        document.removeEventListener('touchstart', unlockAudio);
                    });
                };
                document.addEventListener('click', unlockAudio);
                document.addEventListener('touchstart', unlockAudio);
            });
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '⏸';
                localStorage.setItem('audioPlaying', 'true');
            } else {
                audio.pause();
                playBtn.innerText = '▶';
                localStorage.setItem('audioPlaying', 'false');
            }
        }

        audio.addEventListener('timeupdate', () => {
            localStorage.setItem('audioCurrentTime', audio.currentTime);
        });

        window.addEventListener('beforeunload', () => {
            localStorage.setItem('audioCurrentTime', audio.currentTime);
            localStorage.setItem('audioPlaying', !audio.paused);
        });
    </script>
</body>
</html>
